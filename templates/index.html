<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Laporan & Checklist PLTA Curug</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4>Form Input Laporan & Checklist - PLTA Curug PJT II</h4>
            </div>
            <div class="card-body">
                <form action="/generate" method="POST">
                    <!-- Lokasi / Unit -->
                    <div class="mb-3">
                        <label for="lokasi" class="form-label fw-bold">Unit / Lokasi Kerja</label>
                        <select class="form-select" id="lokasi" name="lokasi" required>
                            <option value="">-- Pilih Unit Kerja --</option>
                            <option value="Gardu Induk Curug">Gardu Induk Curug</option>
                            <option value="Mini Hydro">Mini Hydro</option>
                            <option value="Pompa Elektrik Tarum Timur">Pompa Elektrik Tarum Timur</option>
                        </select>
                    </div>

                    <!-- Tanggal -->
                    <div class="mb-3">
                        <label for="tanggal" class="form-label fw-bold">Tanggal</label>
                        <input type="date" class="form-control" id="tanggal" name="tanggal" required>
                    </div>

                    <!-- Nama Petugas -->
                    <div class="mb-3">
                        <label for="petugas" class="form-label fw-bold">Nama Petugas</label>
                        <input type="text" class="form-control" id="petugas" name="petugas" placeholder="Masukkan nama petugas..." required>
                    </div>

                    <!-- Pilihan Mode Checklist -->
                    <div class="mb-3">
                        <label for="mode_checklist" class="form-label fw-bold">Mode Pengisian Checklist</label>
                        <select class="form-select" id="mode_checklist" name="mode_checklist" onchange="toggleModeChecklist()" required>
                            <option value="manual">Mode Manual</option>
                            <option value="otomatis">Mode Otomatis (Prosedur Baku / SOP)</option>
                        </select>
                    </div>

                    <!-- Container Prosedur Otomatis (SOP) -->
                    <div class="mb-3" id="container_prosedur_otomatis" style="display: none;">
                        <label for="prosedur_otomatis" class="form-label fw-bold text-danger">Pilih Prosedur Standar (SOP)</label>
                        <select class="form-select border-danger" id="prosedur_otomatis" name="prosedur_otomatis">
                            <option value="">-- Pilih Prosedur Otomatis --</option>
                            <option value="1">1. Pengamanan gangguan/trip Gardu Induk 70 / 6,3 kV Curug</option>
                            <option value="2">2. Pindah line penghantar 70 kV dari Jatiluhur ke Kosambi (F-20/DPL/IK.12-01)</option>
                            <option value="3">3. Pindah line penghantar 70 kV dari Kosambi ke Jatiluhur (F-20/DPL/IK.12-02)</option>
                            <option value="4">4. Operasi PLTA Mini Hydro Curug (F-20/DPL/IK.10-01)</option>
                        </select>
                    </div>

                    <!-- Container Input Manual (Muncul jika mode manual) -->
                    <div class="mb-3" id="container_manual">
                        <label for="keterangan_manual" class="form-label fw-bold">Keterangan / Catatan Penanganan Manual</label>
                        <textarea class="form-control" id="keterangan_manual" name="keterangan_manual" rows="3" placeholder="Tuliskan catatan atau kronologi penanganan gangguan..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-success">Generate Laporan PDF</button>
                    <a href="/" class="btn btn-secondary">Kembali ke Beranda</a>
                </form>
            </div>
        </div>
    </div>

    <!-- Script JavaScript untuk Mengatur Tampilan Berdasarkan Mode -->
    <script>
        function toggleModeChecklist() {
            var mode = document.getElementById('mode_checklist').value;
            var containerOtomatis = document.getElementById('container_prosedur_otomatis');
            var containerManual = document.getElementById('container_manual');
            
            if (mode === 'otomatis') {
                containerOtomatis.style.display = 'block';
                containerManual.style.display = 'none';
            } else {
                containerOtomatis.style.display = 'none';
                containerManual.style.display = 'block';
            }
        }
    </script>
</body>
</html>
